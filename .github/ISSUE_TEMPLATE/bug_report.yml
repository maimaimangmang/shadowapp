name: Bug report / 问题反馈
description: Report a launcher problem or version compatibility result.
body:
  - type: markdown
    attributes:
      value: "Please do not include account tokens, auth.json, email addresses, full logs, or profile directories."
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: macOS version, chip architecture, Codex version, launcher version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result / 复现步骤与结果
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
